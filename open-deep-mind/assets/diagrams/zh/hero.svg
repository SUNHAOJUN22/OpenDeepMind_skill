<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">开放深度思维系统</title><desc id="desc">用第一哲学审查基础，用第一性原理重构方案；以竞争模型、证伪与迭代保持可修正。</desc>
    <defs>
      <linearGradient id="hero-zh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset=".55" stop-color="#0a1930"/><stop offset="1" stop-color="#10112a"/></linearGradient>
      <linearGradient id="hero-zh-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5de4ff"/><stop offset="1" stop-color="#3c8dff"/></linearGradient>
      <linearGradient id="hero-zh-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f7bf5a"/></linearGradient>
      <linearGradient id="hero-zh-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#b68cff"/></linearGradient>
      <linearGradient id="hero-zh-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#55e3b2"/></linearGradient>
      <radialGradient id="hero-zh-halo"><stop offset="0" stop-color="#5de4ff" stop-opacity=".32"/><stop offset="1" stop-color="#5de4ff" stop-opacity="0"/></radialGradient>
      <pattern id="hero-zh-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7aa2cc" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="hero-zh-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="hero-zh-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000814" flood-opacity=".25"/></filter>
