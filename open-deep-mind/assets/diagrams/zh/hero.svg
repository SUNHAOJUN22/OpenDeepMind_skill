      <clipPath id="hero-zh-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="hero-zh-fade" x1="0" x2="1"><stop offset="0" stop-color="#050b14" stop-opacity="1"/><stop offset=".35" stop-color="#050b14" stop-opacity=".55"/><stop offset="1" stop-color="#050b14" stop-opacity="0"/></linearGradient>
      
      <style>
