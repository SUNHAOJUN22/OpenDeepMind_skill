    <text x="84" y="158" class="subtitle">用第一哲学审查基础，用第一性原理重构方案；以竞争模型、证伪与迭代保持可修正。</text><rect x="84" y="190" width="112" height="34" rx="17" fill="#5de4ff" opacity=".92"/><text x="140.0" y="213" text-anchor="middle" style="font:700 14px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">第一哲学</text><rect x="208" y="190" width="119" height="34" rx="17" fill="#55e3b2" opacity=".92"/><text x="267.5" y="213" text-anchor="middle" style="font:700 14px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">第一性原理</text><rect x="339" y="190" width="112" height="34" rx="17" fill="#f7bf5a" opacity=".92"/><text x="395.0" y="213" text-anchor="middle" style="font:700 14px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">系统思维</text><rect x="463" y="190" width="112" height="34" rx="17" fill="#b68cff" opacity=".92"/><text x="519.0" y="213" text-anchor="middle" style="font:700 14px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">科学建模</text><rect x="587" y="190" width="112" height="34" rx="17" fill="#ff6b72" opacity=".92"/><text x="643.0" y="213" text-anchor="middle" style="font:700 14px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">创造实践</text><rect x="711" y="190" width="119" height="34" rx="17" fill="#3c8dff" opacity=".92"/><text x="770.5" y="213" text-anchor="middle" style="font:700 14px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">AI 增强</text><rect x="84" y="268" width="780" height="78" rx="18" class="card"/><rect x="100" y="283" width="150" height="48" rx="14" fill="#5de4ff" opacity=".16" stroke="#5de4ff" stroke-opacity=".6"/><text x="175" y="313" text-anchor="middle" class="tiny" fill="#5de4ff">基础集合</text><text x="276" y="316" class="formula">F = {D, O, L, C, A, E, V, U}</text><rect x="84" y="362" width="780" height="78" rx="18" class="card"/><rect x="100" y="377" width="150" height="48" rx="14" fill="#55e3b2" opacity=".16" stroke="#55e3b2" stroke-opacity=".6"/><text x="175" y="407" text-anchor="middle" class="tiny" fill="#55e3b2">模型竞争</text><text x="276" y="410" class="formula">M* = arg max [Evidence(M) − Bias(M) − λ·Complexity(M)]</text><rect x="84" y="456" width="780" height="78" rx="18" class="card"/><rect x="100" y="471" width="150" height="48" rx="14" fill="#f7bf5a" opacity=".16" stroke="#f7bf5a" stroke-opacity=".6"/><text x="175" y="501" text-anchor="middle" class="tiny" fill="#f7bf5a">决策目标</text><text x="276" y="504" class="formula">a* = arg min [Cost(a) + Risk(a) − Value(a)]</text><rect x="84" y="615" width="260" height="142" rx="22" class="card"/><circle cx="128" cy="659" r="22" fill="#5de4ff" opacity=".16" stroke="#5de4ff"/><path d="M107.2,659 Q128,644.05 148.8,659 Q128,673.95 107.2,659Z" fill="none" stroke="#5de4ff" stroke-width="4"/><circle cx="128" cy="659" r="5.46" fill="#f7bf5a"/><circle cx="128" cy="659" r="1.95" fill="#050b14"/><text x="162" y="654" class="h3">第一哲学</text><text x="162" y="682" class="small">基础资格审查</text><text x="108" y="726" class="tiny">Φ8 → P9 → M₁…Mₙ → Q → Δ</text><line x1="349" y1="685" x2="367" y2="685" stroke="#5de4ff" stroke-width="3" marker-end="url(#hero-zh-arrow)"/><rect x="374" y="615" width="260" height="142" rx="22" class="card"/><circle cx="418" cy="659" r="22" fill="#55e3b2" opacity=".16" stroke="#55e3b2"/><polygon points="418,644 430.9,651.5 430.9,666.5 418,674 405.1,666.5 405.1,651.5" fill="none" stroke="#55e3b2" stroke-width="4"/><path d="M418,644V674M405.1,651.5L418,659L430.9,651.5" fill="none" stroke="#55e3b2" stroke-width="3"/><text x="452" y="654" class="h3">第一性原理</text><text x="452" y="682" class="small">拆解—重构</text><text x="398" y="726" class="tiny">Φ8 → P9 → M₁…Mₙ → Q → Δ</text><line x1="639" y1="685" x2="657" y2="685" stroke="#5de4ff" stroke-width="3" marker-end="url(#hero-zh-arrow)"/><rect x="664" y="615" width="260" height="142" rx="22" class="card"/><circle cx="708" cy="659" r="22" fill="#f7bf5a" opacity=".16" stroke="#f7bf5a"/><line x1="708" y1="645" x2="