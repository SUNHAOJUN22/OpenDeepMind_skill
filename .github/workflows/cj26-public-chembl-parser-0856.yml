name: Public parser dependency 0856
on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-chembl-parser-0856.yml]
permissions: {contents: read}
jobs:
  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: {python-version: '3.13'}
      - run: |
          mkdir wheel
          python -m pip wheel --no-deps --wheel-dir wheel chembl_structure_pipeline==1.2.2
          python - <<'PY'
          import hashlib,json,pathlib
          files=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in pathlib.Path('wheel').glob('*.whl')]
          pathlib.Path('wheel/MANIFEST.json').write_text(json.dumps(files,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-chembl-parser-wheel, path: wheel/, retention-days: 1, compression-level: 0, if-no-files-found: error}
