name: CJ26 public-target bounded cloud pilot
on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-target-cloud-pilot-20261106.yml]
permissions:
  contents: read
concurrency:
  group: cj26-public-target-cloud-pilot-20261106
  cancel-in-progress: false
jobs:
  public-target-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Public-target request, bounded polling, encrypted return
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, http.cookiejar, json, pathlib, re, subprocess, tarfile, time, urllib.request, urllib.error, urllib.parse
          root=pathlib.Path('private_run'); root.mkdir()
          out=pathlib.Path('return_artifact'); out.mkdir()
          cert='''-----BEGIN CERTIFICATE-----
          MIIEMzCCApugAwIBAgIUFxTsw+Ai37CCbLKuxuDCXXsvfukwDQYJKoZIhvcNAQEL
          BQAwKTEnMCUGA1UEAwweQ0oyNiBvbmUtc2hvdCByZXN1bHQgdHJhbnNwb3J0MB4X
          DTI2MTEwNjEwNTQwM1oXDTI2MTEwOTEwNTQwM1owKTEnMCUGA1UEAwweQ0oyNiBv
          bmUtc2hvdCByZXN1bHQgdHJhbnNwb3J0MIIBojANBgkqhkiG9w0BAQEFAAOCAY8A
          MIIBigKCAYEA4nIrmT/YJhEvwN9wlsc39I3SWRI2c4emPT3VSsAxR21lleHuYLZk
          +5jgLmKxz94Bdviw+NWYJ2GR0VB+B050ZNHnQ9h7X92PsNAcwnRfAuciD9psB83G
          WZ29sUxpAiY4ak34rrDrdck0DZn5JnhMrOGrjQogg1S3QRxsrPPhGBSgRSCO1cP5
          leXWfgzzjpwxMC6LnRsPz8aonHGkbz8NYBWwy7w17XyPvZGjLR6wPNDXfGwLq+jN
          jbR/bDWnBBBh0gYPaKF3zs506S/Xw4CPOiB5L6SpHh+no+GHZDulGncIaIS5Z21C
          ofKvb+v+0qKLknWPepS8qLRDGO6UyKHatxTFGnNbU4/ecYMqZeH6w7aWTEE3H+GU
          8gyoU6PPs3Kioizy21QgXVJFRWJXxltzbxzb15E41ilFGZDGDen5qDqKeaVdBs9B
          elqcKafXCvChz6PfNQ/i8aGICU1q83FU+xuBL4S7M5isXdQrB5fN70yKEFW5uCh/
          5J19yA4jLKl3AgMBAAGjUzBRMB0GA1UdDgQWBBRzVgSgI0f/X/qbLFHuEo93e4kc
          9DAfBgNVHSMEGDAWgBRzVgSgI0f/X/qbLFHuEo93e4kc9DAPBgNVHRMBAf8EBTAD
          AQH/MA0GCSqGSIb3DQEBCwUAA4IBgQBUipZgx4istDsZtwYj7YznCS0tnZMEP9h4
          VqSFJWCSGwaCbN5qvgWLzthZyZCt8qnX225Oe159hcwyIYt2Cmw0mxKrziGZIWqI
          piwucChnLBF00Xff7wyW7r93TdDl/R83VdNxT9FdrXZzkUYa6Nl/zRGknbu0S3S5
          dGpE2unf3SMCNhnPg0hNJAr9M8v2dXISWL9bW2Eoa0S9DX/wdEOAaJmwRkK5wfjv
          JsQVt1Y5M3bROVjPBAeMuY+Av3DS+LO26NLqKJMmdvCiAnm06AN52kZ8fX+AIVB4
          U/1SqzltU1HoPNNrmZiavcCz+LixaTzrsxIqvt1ipYJZRcozw/5U+IEt2RrmNkaT
          +FzwnMTDQ1ninv2eK3GXaYZf0T3r2NQxtANi7WlwUQMyoO21vL1Oe13ElBuHVI4j
          YK54it2cFpv5awXzIDkTtCiKkJRdc859DdLp2JOjPxwT/grrGnbdxiVN2ftog5fa
          I1y1Fipim/DqSh1vFycS3W4eiKXc8Wg=
          -----END CERTIFICATE-----
          '''
          pathlib.Path('recipient.pem').write_text('\n'.join(x.strip() for x in cert.splitlines())+'\n')
          cookies=http.cookiejar.MozillaCookieJar(str(root/'session_cookies.txt'))
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  old=urllib.parse.urlparse(req.full_url); new=urllib.parse.urlparse(newurl)
                  if req.get_method()!='GET' or old.hostname!=new.hostname or new.scheme!='https':
                      raise RuntimeError('Unexpected redirect rejected')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies),SafeRedirect())
          base='https://www.athanortools.com'
          receipt={'purpose':'One RFD3 design against public 2RE9 TL1A trimer', 'existing_private_candidate_data_sent':False, 'max_designs':1, 'post_attempted':False, 'job_accepted':False, 'state':'STARTED', 'status_codes':[], 'collected_files':0}
          def save_json(name,data): (root/name).write_text(json.dumps(data,indent=2)+'\n')
          def fetch(url,name,payload=None,limit=30000000):
              headers={'User-Agent':'CJ26-public-target-research/1.0','Accept':'application/json, */*'}
              body=None
              if payload is not None:
                  body=json.dumps(payload).encode(); headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=body,headers=headers,method='POST' if body else 'GET')
              try:
                  with opener.open(req,timeout=70) as response:
                      raw=response.read(limit+1); code=response.status
                      if len(raw)>limit: raise RuntimeError('Response exceeds size bound')
              except urllib.error.HTTPError as exc:
                  raw=exc.read(500000); code=exc.code
              (root/name).write_bytes(raw)
              receipt['status_codes'].append({'phase':name,'http':code})
              cookies.save(ignore_discard=True,ignore_expires=True)
              return code,raw
          def same_origin_url(value):
              if not isinstance(value,str): raise RuntimeError('Non-string URL')
              u=urllib.parse.urljoin(base,value); p=urllib.parse.urlparse(u)
              if p.scheme!='https' or p.hostname!='www.athanortools.com' or p.username or p.password or p.port not in (None,443): raise RuntimeError('Off-origin result URL rejected')
              return u
          def returned_links(value):
              links=[]
              if isinstance(value,dict):
                  for key,v in value.items():
                      if isinstance(v,str) and ('url' in key.lower() or 'download' in key.lower()) and v.startswith(('https://','/')):
                          try: links.append(same_origin_url(v))
                          except Exception: pass
                      links+=returned_links(v)
              elif isinstance(value,list):
                  for v in value: links+=returned_links(v)
              return links
          try:
              code,raw=fetch(base+'/api/rfd3/','schema.json',limit=3000000)
              if code!=200: receipt['state']='BLOCKED_SCHEMA_HTTP'; raise RuntimeError('Schema unavailable; no POST')
              schema=json.loads(raw)
              save_json('schema_parsed.json',schema)
              code,pdb=fetch('https://files.rcsb.org/download/2RE9.pdb','2RE9_original.pdb',limit=6000000)
              if code!=200: receipt['state']='BLOCKED_PUBLIC_TARGET_DOWNLOAD'; raise RuntimeError('Public target unavailable; no POST')
              text=pdb.decode('ascii'); selected=[]; counts={c:set() for c in 'ABC'}
              for line in text.splitlines():
                  if line.startswith('ATOM  ') and len(line)>=54 and line[21] in counts and 88<=int(line[22:26])<=251 and line[16] in (' ','A'):
                      selected.append(line[:16]+' '+line[17:]); counts[line[21]].add(int(line[22:26]))
              if any(len(v)!=164 for v in counts.values()): receipt['state']='BLOCKED_TARGET_IDENTITY'; raise RuntimeError('Expected 164 observed residues in each public chain')
              target='\n'.join(selected)+'\nEND\n'; (root/'public_target.pdb').write_text(target)
              constraints={'CJ26_T05_NEW_RULE_PUBLIC_PILOT':{'input':'uploaded','dialect':2,'contig':'70-70,/0,A88-251,/0,B88-251,/0,C88-251','select_fixed_atoms':True,'select_unfixed_sequence':False,'redesign_motif_sidechains':False,'select_hotspots':{'A166':'CB,CG,CD,NE,CZ,NH1,NH2','A167':'CB,CG,CD,OE1,NE2','A161':'CB,CG,CD,OE1,OE2'},'infer_ori_strategy':'hotspots','is_non_loopy':True,'cif_parser_args':{'add_missing_atoms':False,'remove_ccds':[]}}}
              payload={'input_mode':'text','inputs':json.dumps(constraints),'spec_input_file':target,'job_name':'CJ26-public-TL1A-one-sample-20261106','n_batches':1,'diffusion_batch_size':1,'inference_sampler.num_timesteps':200,'low_memory_mode':True,'dump_trajectories':False,'prevalidate_inputs':True,'output_full_json':True,'dump_prediction_metadata_json':True}
              save_json('public_request.json',payload)
              receipt['input_sha256']=hashlib.sha256(json.dumps(payload,sort_keys=True).encode()).hexdigest()
              receipt['post_attempted']=True
              code,raw=fetch(base+'/api/rfd3/','submit_response.json',payload)
              if code not in (200,202): receipt['state']='REQUEST_REJECTED'; raise RuntimeError('POST did not accept; no retry')
              data=json.loads(raw); job=data.get('job',{})
              if not job.get('id') or not job.get('status_url'): receipt['state']='UNKNOWN_ACCEPTANCE_NO_RECOVERY_ID'; raise RuntimeError('No returned job recovery ID; no retry')
              receipt['job_accepted']=True; status_url=same_origin_url(job['status_url']); save_json('job_recovery.json',{'job':job,'status_url':status_url})
              start=time.monotonic()
              for index in range(41):
                  if index:
                      if time.monotonic()-start>600: break
                      time.sleep(15)
                  code,raw=fetch(status_url,'poll_%03d.json'%index,limit=30000000)
                  if code!=200: receipt['state']='RECOVERY_HTTP_STOP'; break
                  data=json.loads(raw); job=data.get('job',data); state=job.get('status','unknown'); receipt['state']=state
                  print(json.dumps({'phase':'poll','index':index,'status':state,'elapsed_seconds':round(time.monotonic()-start)}))
                  if state in ('succeeded','failed','cancelled'):
                      for j,url in enumerate(list(dict.fromkeys(returned_links(job.get('result',{}))))[:16]):
                          code,content=fetch(url,'returned_artifact_%02d'%j,limit=60000000)
                          if code==200: receipt['collected_files']+=1
                      break
              if receipt['state'] in ('queued','running'): receipt['state']='PENDING_AT_BOUNDED_POLL_LIMIT'
          except Exception as exc:
              save_json('error.json',{'type':type(exc).__name__,'message':str(exc)[:2000]})
              if receipt['state']=='STARTED': receipt['state']='UNKNOWN_POST_OUTCOME' if receipt['post_attempted'] else 'BLOCKED_BEFORE_POST'
          finally:
              cookies.save(ignore_discard=True,ignore_expires=True)
              save_json('receipt.json',receipt)
              with tarfile.open('private_payload.tar.gz','w:gz') as archive: archive.add(root,arcname='private_run')
              subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-cbc','-in','private_payload.tar.gz','-outform','DER','-out',str(out/'encrypted_payload.cms'),'recipient.pem'],check=True)
              encrypted=(out/'encrypted_payload.cms').read_bytes()
              receipt['encrypted_payload_sha256']=hashlib.sha256(encrypted).hexdigest()
              (out/'public_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
              print(json.dumps(receipt,indent=2))
          PY
      - name: Return encrypted results only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cj26-public-target-cloud-pilot-encrypted-20261106
          path: return_artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
