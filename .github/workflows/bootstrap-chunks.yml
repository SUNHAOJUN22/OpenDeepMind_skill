name: bootstrap-validated-repository-from-chunks

on:
  push:
    branches: [main]
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and unpack validated repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload.part-* > /tmp/OpenDeepMind_skill_payload.tar.xz.b64
          base64 --decode /tmp/OpenDeepMind_skill_payload.tar.xz.b64 > /tmp/OpenDeepMind_skill_payload.tar.xz
          tar -xJf /tmp/OpenDeepMind_skill_payload.tar.xz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml .github/workflows/bootstrap-chunks.yml
          python open-deep-mind/scripts/validate_repository.py .
          python open-deep-mind/scripts/validate_ledger.py open-deep-mind/assets/example-ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: build OpenDeepMind dual-engine reasoning skill"
          git push origin HEAD:main
