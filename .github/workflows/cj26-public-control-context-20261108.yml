name: CJ26 public control context
on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-control-context-20261108.yml]
permissions:
  contents: read
concurrency:
  group: cj26-public-control-context-20261108
  cancel-in-progress: false
jobs:
  read-public-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Get public experimental reference and read-only service schema
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, hashlib, json, datetime
          out=pathlib.Path('public_assets');out.mkdir()
          jobs=[('7OPB.cif','https://files.rcsb.org/download/7OPB.cif',8000000),('rfd3_public_schema.json','https://www.athanortools.com/api/rfd3/',2000000)]
          rows=[]
          for name,url,limit in jobs:
              row={'name':name,'source_url':url,'method':'GET'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'CJ26-public-calibration-audit/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read(limit+1);row['http_status']=r.status
                  if len(b)>limit:raise ValueError('public asset size bound')
                  if name.endswith('.cif') and not b.lstrip().startswith(b'data_'):raise ValueError('not mmCIF')
                  if name.endswith('.json'):json.loads(b)
                  (out/name).write_bytes(b);row.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),saved=True)
              except Exception as e:row.update(saved=False,error=type(e).__name__+': '+str(e))
              rows.append(row)
          manifest={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'private_data_uploaded':False,'model_inference_submitted':False,'requests_are_get_only':True,'assets':rows}
          (out/'PUBLIC_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n');print(json.dumps(manifest,indent=2))
          PY
      - name: Return public assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cj26-public-control-context-20261108
          path: public_assets/
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
