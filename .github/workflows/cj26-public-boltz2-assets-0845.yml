name: Public Boltz2 structure assets 0845

on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-boltz2-assets-0845.yml]
permissions:
  contents: read
concurrency:
  group: cj26-public-boltz2-assets-0845
  cancel-in-progress: false
jobs:
  public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up dependency wheel target
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Retrieve only author-published public assets
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, tarfile, urllib.request, time
          out=pathlib.Path('bundle');out.mkdir(); (out/'mols').mkdir()
          def getjson(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'public-model-asset-verification/1.0'}),timeout=60) as r:return json.load(r)
          info=getjson('https://huggingface.co/api/models/boltz-community/boltz-2?blobs=true')
          revision=info['sha']; entries={x['rfilename']:x for x in info['siblings']}
          specs=[('boltz2_conf.ckpt',2500000000),('mols.tar',2100000000)]
          def download(spec):
              name,limit=spec; expected=entries[name]['lfs']['sha256']
              url=f'https://huggingface.co/boltz-community/boltz-2/resolve/{revision}/{name}?download=true'
              p=out/name;h=hashlib.sha256();n=0;started=time.monotonic()
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'public-model-asset-verification/1.0'}),timeout=180) as r,p.open('wb') as f:
                  if r.status!=200 or not r.url.startswith('https://'):raise RuntimeError('HTTPS download failed')
                  for b in iter(lambda:r.read(4*1024*1024),b''):
                      n+=len(b)
                      if n>limit or time.monotonic()-started>850:raise RuntimeError('Bounded download exceeded')
                      f.write(b);h.update(b)
              if h.hexdigest()!=expected:raise RuntimeError('Published SHA256 mismatch '+name)
              return {'name':name,'source_url':url,'revision':revision,'bytes':n,'sha256':h.hexdigest(),'published_sha256_verified':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:records=list(pool.map(download,specs))
          wanted=set('ALA ARG ASN ASP CYS GLN GLU GLY HIS ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL UNK A C G U N DA DC DG DT DN NAG MAN BMA'.split())
          found=[]
          with tarfile.open(out/'mols.tar') as t:
              for m in t:
                  p=pathlib.PurePosixPath(m.name)
                  if p.name.endswith('.pkl') and p.stem in wanted and m.isfile():
                      data=t.extractfile(m).read();(out/'mols'/p.name).write_bytes(data)
                      found.append({'name':p.name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          if not set('ALA ARG ASN ASP CYS GLN GLU GLY HIS ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL'.split()).issubset({pathlib.Path(x['name']).stem for x in found}):raise RuntimeError('Canonical residues missing')
          commit='b1ebfc46ecf57f5414e0d1a6f9027bbb122c53bc'
          url=f'https://codeload.github.com/jwohlwend/boltz/zip/{commit}'
          with urllib.request.urlopen(url,timeout=120) as r:data=r.read(50000000)
          if len(data)>=50000000:raise RuntimeError('Source archive too large')
          (out/'boltz_source.zip').write_bytes(data)
          parts=[]
          with (out/'boltz2_conf.ckpt').open('rb') as f:
              i=0
              while True:
                  b=f.read(480000000)
                  if not b:break
                  d=pathlib.Path('parts')/f'part{i:02d}';d.mkdir(parents=True)
                  p=d/f'boltz2_conf.ckpt.part{i:02d}';p.write_bytes(b)
                  parts.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()});i+=1
          manifest={'public_assets_only':True,'private_candidate_data_uploaded':False,'protein_predictions_in_cloud':0,'source_commit':commit,'source_zip_sha256':hashlib.sha256(data).hexdigest(),'assets':records,'checkpoint_parts':parts,'molecule_components':found}
          (out/'PUBLIC_BOLTZ2_ASSETS.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          # The original large files are reproducible public downloads, not user data.
          (out/'boltz2_conf.ckpt').unlink();(out/'mols.tar').unlink()
          PY
      - name: Public dependency wheels only
        run: |
          mkdir -p bundle/wheels
          python -m pip download --only-binary=:all: --no-deps -d bundle/wheels hydra-core==1.3.2 einx==0.3.0 mashumaro==3.14 modelcif==1.2 ihm frozendict dm-tree==0.1.9 absl-py wrapt
      - name: Return part 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-boltz2-conf-part00, path: parts/part00/, retention-days: 1, compression-level: 0, if-no-files-found: error}
      - name: Return part 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-boltz2-conf-part01, path: parts/part01/, retention-days: 1, compression-level: 0, if-no-files-found: error}
      - name: Return part 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-boltz2-conf-part02, path: parts/part02/, retention-days: 1, compression-level: 0, if-no-files-found: error}
      - name: Return part 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-boltz2-conf-part03, path: parts/part03/, retention-days: 1, compression-level: 0, if-no-files-found: error}
      - name: Return part 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-boltz2-conf-part04, path: parts/part04/, retention-days: 1, compression-level: 0, if-no-files-found: error}
      - name: Return metadata and public dependencies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: public-boltz2-canonicals-source-deps, path: bundle/, retention-days: 1, compression-level: 0, if-no-files-found: error}
