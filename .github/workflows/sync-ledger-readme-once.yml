name: One-time bilingual ledger boundary synchronization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-ledger-readme-once.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor == 'SUNHAOJUN22'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact documentation base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify immutable source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ea2d744ea75e60c4078bd47a9bd53fb62a0db1e8"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Synchronize tested input boundary in both READMEs
        shell: python
        run: |
          from pathlib import Path

          english = Path("README.md")
          text = english.read_text(encoding="utf-8")
          anchor = "The iterative validator limits raw JSON to 8 MiB, nesting to 128 levels, records to 10,000 and references to 100,000. It rejects duplicate JSON keys, unpaired Unicode surrogates, nonfinite values and nonzero numbers that underflow to zero during float conversion. Exact zero such as `0e-999` and a representable subnormal such as `5e-324` remain subject to ordinary field validation."
          replacement = anchor + " Ledger validation accepts only a stable regular file: symbolic links, directories, FIFOs and other special files are rejected before parsing; on POSIX, the file is opened nonblocking and no-follow, then checked against the observed device and inode identity."
          if text.count(anchor) != 1:
              raise SystemExit(f"unexpected English README anchor count: {text.count(anchor)}")
          english.write_text(text.replace(anchor, replacement), encoding="utf-8", newline="\n")

          chinese = Path("README.zh-CN.md")
          text = chinese.read_text(encoding="utf-8")
          anchor = "迭代式校验器限制原始 JSON 为 8 MiB、嵌套深度为 128、记录数为 10,000、引用数为 100,000。重复 JSON 键、孤立 Unicode 代理字符、非有限数值，以及转成浮点数时下溢为零的非零数值都会被拒绝。精确零 `0e-999` 和可表示的次正规数 `5e-324` 仍须通过各字段自己的范围检查。"
          replacement = anchor + " 账本校验只接受身份稳定的普通文件：符号链接、目录、FIFO 和其他特殊文件会在解析前被拒绝；在 POSIX 上，文件以非阻塞、禁止跟随链接的方式打开，并与事先观察到的设备号和 inode 身份交叉核对。"
          if text.count(anchor) != 1:
              raise SystemExit(f"unexpected Chinese README anchor count: {text.count(anchor)}")
          chinese.write_text(text.replace(anchor, replacement), encoding="utf-8", newline="\n")
      - name: Remove staging workflow and commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-ledger-readme-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: document hardened ledger file boundary"
      - name: Validate synchronized documentation and repository
        shell: bash
        run: |
          set -euo pipefail
          python open-deep-mind/scripts/validate_repository.py .
          python -m unittest discover -s open-deep-mind/tests -p "test_*.py" -v
          python -m compileall -q open-deep-mind
          git diff --exit-code
      - name: Publish one atomic documentation commit
        shell: bash
        run: git push origin HEAD:main
