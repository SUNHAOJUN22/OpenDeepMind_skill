name: Apply skill-native V15

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skill_native_v15.py
      - .github/workflows/apply-skill-native-v15.yml
      - scripts/tsao_v15_bootstrap_probe.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-deep-mind-skill-native-v15
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply deterministic repository update
        run: python scripts/apply_skill_native_v15.py
      - name: Validate canonical Skill and Unicode
        run: python scripts/validate_skill.py --root . --report artifacts/skill-validation-v15.json
      - name: Run deterministic scientific contract tests
        run: python -m unittest discover -s open-deep-mind/tests -p 'test_*.py' -v
      - name: Remove one-shot bootstrap files
        shell: bash
        run: |
          rm -f scripts/apply_skill_native_v15.py scripts/tsao_v15_bootstrap_probe.txt .github/workflows/apply-skill-native-v15.yml
      - name: Commit verified result to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: finalize OpenDeepMind skill-native V15'
          git push origin HEAD:main
