name: Read-only encrypted recovery of existing protein job
on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-readonly-sealed-recovery-20261106-1415.yml]
permissions:
  contents: read
concurrency:
  group: cj26-readonly-recovery-20261106-1415
  cancel-in-progress: false
jobs:
  recover-existing-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install encryption dependency and generate ephemeral receiving key
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography==46.0.3'
          python3 - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization as s
          p=Path('transport_public');p.mkdir()
          k=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          Path('ephemeral_private.pem').write_bytes(k.private_bytes(s.Encoding.PEM,s.PrivateFormat.PKCS8,s.NoEncryption()))
          Path('ephemeral_private.pem').chmod(0o600)
          (p/'receiving_public.pem').write_bytes(k.public_key().public_bytes(s.Encoding.PEM,s.PublicFormat.SubjectPublicKeyInfo))
          PY
      - name: Publish public transport key only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cj26-readonly-receiving-public-key-1415
          path: transport_public/
          retention-days: 1
      - name: Read encrypted handoff and recover existing results with GET only
        shell: bash
        run: |
          python3 - <<'PY'
          import os,io,re,json,time,hashlib,base64,zipfile,pathlib,urllib.request,urllib.parse,urllib.error,http.cookiejar,html
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          PUB='''-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtu2t1/r6xl/eYFG17dw5
          8mYU6Tr2kn4ejfBfzTtMfSuIK3xfasykElr9m332khsXu59tI3b9POhcpxVhUnoz
          bK+bmahxSTWqSZPQgyKbz/0x7BqnDoO0tmf2fI9O/N4iHF0ajOXWI+GKD_PLACEHOLDER
          -----END PUBLIC KEY-----'''
          # The real recovery public key is supplied in the authenticated handoff.
          R=pathlib.Path('private_recovery');R.mkdir();O=pathlib.Path('sealed_recovery');O.mkdir()
          S={'purpose':'GET-only recovery of previously submitted design','new_submissions':0,'status':'WAITING_FOR_ENCRYPTED_HANDOFF','downloaded_files':0}
          def save(n,b):
              p=R/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b if isinstance(b,bytes) else str(b).encode())
          deadline=time.monotonic()+240;envelope=None
          handoff='https://raw.githubusercontent.com/SUNHAOJUN22/OpenDeepMind_skill/cj26-public-model-assets-20261104/cj26-transport/handoff-20261106-1415.json'
          while time.monotonic()<deadline:
              try:
                  with urllib.request.urlopen(handoff,timeout=20) as r:
                      if r.status==200:envelope=json.loads(r.read(50000));break
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              time.sleep(5)
          if envelope is None:raise RuntimeError('No encrypted handoff received; no service request sent')
          private=serialization.load_pem_private_key(pathlib.Path('ephemeral_private.pem').read_bytes(),password=None)
          aes=private.decrypt(base64.b64decode(envelope['wrapped_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          raw=AESGCM(aes).decrypt(base64.b64decode(envelope['nonce']),base64.b64decode(envelope['ciphertext']),b'CJ26-readonly-session-handoff-v1')
          capsule=json.loads(raw);PUB=capsule['recovery_public_key'];BASE='https://www.athanortools.com'
          save('handoff_private.json',raw);save('cookies.txt',capsule['cookies'])
          jar=http.cookiejar.MozillaCookieJar(str(R/'cookies.txt'));jar.load(ignore_discard=True,ignore_expires=True)
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(u,limit=40000000,timeout=30):
              p=urllib.parse.urlparse(u)
              if p.scheme!='https' or p.hostname not in {'www.athanortools.com','athanortools.com'}:raise ValueError('Unexpected service URL')
              if any(x in p.path for x in ['/abort','/delete','/cancel','/logout']):raise ValueError('Mutating URL rejected')
              try:
                  with op.open(urllib.request.Request(u,method='GET',headers={'User-Agent':'CJ26-readonly-recovery/1.0'}),timeout=timeout) as r:
                      q=urllib.parse.urlparse(r.url)
                      if q.scheme!='https' or q.hostname not in {'www.athanortools.com','athanortools.com'}:raise ValueError('Unexpected redirect')
                      b=r.read(limit+1)
                      if len(b)>limit:raise ValueError('File limit exceeded')
                      return r.status,dict(r.headers),b
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read(1000000)
          try:
              u=urllib.parse.urljoin(BASE,capsule['status_url'])
              if not urllib.parse.urlparse(u).path.startswith('/api/jobs/'):raise ValueError('Not a job status URL')
              deadline=time.monotonic()+480;i=0;d={}
              while time.monotonic()<deadline:
                  i+=1;code,h,b=get(u,limit=12000000);save(f'polls/{i:03d}.json',b);S['last_http_status']=code
                  if code!=200:S['status']='GET_FAILED';break
                  d=json.loads(b);j=d.get('job',d);S['status']=str(j.get('status','UNKNOWN'))
                  if S['status'] in {'succeeded','failed','cancelled'}:break
                  time.sleep(10)
              if S['status'] in {'succeeded','failed'}:
                  urls=[urllib.parse.urljoin(BASE,capsule['results_url'])];done=set()
                  def walk(x):
                      if isinstance(x,dict):
                          for k,v in x.items():
                              if isinstance(v,str) and ('url' in k.lower() or 'download' in k.lower()) and (v.startswith('/') or v.startswith('https://')):urls.append(urllib.parse.urljoin(BASE,v))
                              elif isinstance(v,(list,dict)):walk(v)
                      elif isinstance(x,list):
                          for v in x:walk(v)
                  walk(d)
                  collection_deadline=time.monotonic()+100
                  while urls and len(done)<18 and time.monotonic()<collection_deadline:
                      v=urls.pop(0);p=urllib.parse.urlparse(v)
                      if p.hostname not in {'www.athanortools.com','athanortools.com'} or v in done or '/api/jobs/' in v or any(t in v for t in ['abort','delete','cancel','logout']):continue
                      done.add(v);code,h,b=get(v)
                      save(f'downloads/{len(done):02d}.bin',b);save(f'downloads/{len(done):02d}_meta.json',json.dumps({'url':v,'http_status':code,'headers':h,'sha256':hashlib.sha256(b).hexdigest()}))
                      S['downloaded_files']+=int(code==200)
                      if code==200 and 'text/html' in h.get('Content-Type',''):
                          for href in re.findall(r'href=[\"\']([^\"\']+)[\"\']',b.decode(errors='replace')):
                              if any(t in href.lower() for t in ['download','.zip','.cif','.pdb','.json','.fasta']):urls.append(urllib.parse.urljoin(v,html.unescape(href)))
              else:S['collection_incomplete']=True
          except Exception as e:
              S['exception_class']=type(e).__name__;save('failure.txt',repr(e))
          finally:
              save('summary.json',json.dumps(S,indent=2));buf=io.BytesIO();manifest={}
              with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(R.rglob('*')):
                      if p.is_file():
                          b=p.read_bytes();n=p.relative_to(R).as_posix();manifest[n]=hashlib.sha256(b).hexdigest();z.writestr(n,b)
                  z.writestr('manifest.json',json.dumps(manifest,indent=2))
              k=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12);aad=b'CJ26-public-target-single-rfd3-run-v1';cipher=AESGCM(k).encrypt(nonce,buf.getvalue(),aad)
              pub=serialization.load_pem_public_key(PUB.encode());wrapped=pub.encrypt(k,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
              (O/'result.aesgcm').write_bytes(cipher)
              (O/'encryption.json').write_text(json.dumps({'algorithm':'RSA-OAEP-SHA256+AES-256-GCM','wrapped_key':base64.b64encode(wrapped).decode(),'nonce':base64.b64encode(nonce).decode(),'aad':base64.b64encode(aad).decode(),'ciphertext_sha256':hashlib.sha256(cipher).hexdigest()},indent=2))
              (O/'public_status.json').write_text(json.dumps(S,indent=2));print(json.dumps(S,indent=2))
          PY
      - name: Return authenticated encrypted recovery only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cj26-readonly-recovered-sealed-1415
          path: sealed_recovery/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
