name: One-shot OpenDeepMind closure qualification

on:
  push:
    branches: [closure/20260828-code-readme]

permissions:
  contents: write

concurrency:
  group: opendeepmind-closure-20260828
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closure/20260828-code-readme
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply reviewed non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > /tmp/closure.patch.gz <<'PATCH'
          
          PATCH
          printf '%s  %s\n' c61c13a49cff091155a987a6ca11c95b531c31c6e0624f3c15d703ad180d1141 /tmp/closure.patch.gz | sha256sum --check
          gzip -dc /tmp/closure.patch.gz > /tmp/closure.patch
          git apply --index --binary /tmp/closure.patch
      - name: Qualify benchmark and README closure
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q open-deep-mind tests
          python -m unittest discover -s open-deep-mind/tests -p 'test_*.py' -v
          python open-deep-mind/evals/scripts/validate_cases.py
          python open-deep-mind/evals/scripts/validate_task_contract.py
          git diff --check
      - name: Commit qualified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(closure): reject nonfinite metrics and clarify publication boundary'
          git push origin HEAD:closure/20260828-code-readme
