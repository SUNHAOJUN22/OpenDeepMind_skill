name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python open-deep-mind/scripts/validate_repository.py .
      - name: Validate example claim ledger
        run: python open-deep-mind/scripts/validate_ledger.py open-deep-mind/assets/example-ledger.json
      - name: Validate complete TRIZ subsystem
        run: python open-deep-mind/triz/scripts/validate_triz_module.py
      - name: Smoke-test TRIZ matrix lookup
        run: python open-deep-mind/triz/scripts/lookup_matrix.py --improve 1 --worsen 3 --json
