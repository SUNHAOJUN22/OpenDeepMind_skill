name: CJ26 mapped public-target cloud pilot
on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-target-cloud-pilot-mapped-20261106.yml]
permissions:
  contents: read
concurrency:
  group: cj26-public-target-cloud-pilot-mapped-20261106
  cancel-in-progress: false
jobs:
  public-target-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Apply explicit residue mapping to pinned reviewed client
        shell: bash
        run: |
          python3 - <<'PY'
          import textwrap, urllib.request, pathlib, hashlib
          url='https://raw.githubusercontent.com/SUNHAOJUN22/OpenDeepMind_skill/1c7deae427baf7e68b7c2e8908dc7bfd8c72c8bb/.github/workflows/cj26-public-target-cloud-pilot-20261106.yml'
          with urllib.request.urlopen(url,timeout=40) as r:
              if r.status!=200: raise RuntimeError('Pinned client unavailable')
              source=r.read(60000).decode()
          source=textwrap.dedent(source.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          old="88<=int(line[22:26])<=251"
          if source.count(old)!=1: raise RuntimeError('Mapping patch precondition failed')
          source=source.replace(old,"17<=int(line[22:26])<=180")
          old="selected.append(line[:16]+' '+line[17:]); counts[line[21]].add(int(line[22:26]))"
          new="mapped=int(line[22:26])+71; selected.append(line[:16]+' '+line[17:22]+f'{mapped:4d}'+line[26:]); counts[line[21]].add(mapped)"
          if source.count(old)!=1: raise RuntimeError('Numbering patch precondition failed')
          source=source.replace(old,new)
          old="target='\\n'.join(selected)+'\\nEND\\n'; (root/'public_target.pdb').write_text(target)"
          extra='''
          amino = dict(zip(['ALA','ARG','ASN','ASP','CYS','GLN','GLU','GLY','HIS','ILE','LEU','LYS','MET','PHE','PRO','SER','THR','TRP','TYR','VAL'],'ARNDCQEGHILKMFPSTWYV'))
          expected='LRADGDKPRAHLTVVRQTPTQHFKNQFPALHWEHELGLAFTKNRMNYTNKFLLIPESGDYFIYSQVTFRGMTSECSEIRQAGRPNKPDSITVVITKVTDSYPEPTQLLMGTKSVCEVGSNWFQPIYLGAMFSLQEGDKLMVNVSDISLVDYTKEDKTFFGAFLL'
          for chain in 'ABC':
              residues={int(line[22:26]):amino[line[17:20]] for line in selected if line[21]==chain}
              if sorted(residues)!=list(range(88,252)) or ''.join(residues[i] for i in sorted(residues))!=expected:
                  receipt['state']='BLOCKED_MAPPED_SEQUENCE_IDENTITY'
                  raise RuntimeError('Public UniProt identity verification failed')
          receipt['residue_mapping']='2RE9 author 17-180 -> UniProt O95150 88-251; offset +71; all three chains exact'
          receipt['unobserved_official_residues']='72-87 per protomer; no coordinates invented'
          '''
          replacement=textwrap.dedent(extra).strip()+'\n'+old
          if source.count(old)!=1: raise RuntimeError('Sequence-check insertion precondition failed')
          source=source.replace(old,replacement.replace('\n','\n    '))
          compile(source,'mapped_client.py','exec')
          pathlib.Path('mapped_client.py').write_text(source)
          exec(compile(source,'mapped_client.py','exec'),{'__name__':'__main__'})
          PY
      - name: Return encrypted results only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cj26-mapped-public-target-cloud-pilot-encrypted-20261106
          path: return_artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
