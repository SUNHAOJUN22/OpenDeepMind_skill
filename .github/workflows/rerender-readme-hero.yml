name: Re-upload README homepage hero

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  replace-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete and freshly re-upload the README hero
        shell: bash
        run: |
          set -euo pipefail
          old='open-deep-mind/assets/diagrams/homepage-bilingual-final.webp'
          new='open-deep-mind/assets/diagrams/homepage-bilingual-reuploaded-20260808.webp'
          tmp='/tmp/homepage-bilingual-reuploaded-20260808.webp'

          test -f bootstrap/READY
          test -f "$old"
          cp "$old" "$tmp"
          rm -f "$old" "$new"
          install -m 0644 "$tmp" "$new"

          python - <<'PY'
          from pathlib import Path

          image = Path('open-deep-mind/assets/diagrams/homepage-bilingual-reuploaded-20260808.webp')
          data = image.read_bytes()
          if len(data) < 100_000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('re-uploaded homepage image is not a valid WebP file')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old_name = 'homepage-bilingual-final.webp'
          new_name = 'homepage-bilingual-reuploaded-20260808.webp'
          if old_name not in text:
              raise SystemExit('README does not contain the expected previous hero path')
          text = text.replace(old_name, new_name)
          text = text.replace('?v=20260808-final-r1', '?v=20260808-reupload-r3')
          readme.write_text(text, encoding='utf-8')
          PY

          rm -rf bootstrap
          rm -f .github/workflows/rerender-readme-hero.yml

      - name: Commit the clean replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'assets: delete and freshly re-upload README homepage hero'
          git push origin HEAD:main
