name: Finalize re-uploaded README homepage hero

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  finalize-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh README reference and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          image='open-deep-mind/assets/diagrams/homepage-bilingual-final.webp'
          test -f bootstrap/READY
          test -f "$image"

          python - <<'PY'
          from pathlib import Path

          image = Path('open-deep-mind/assets/diagrams/homepage-bilingual-final.webp')
          data = image.read_bytes()
          if len(data) < 100_000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('re-uploaded homepage image is not a valid WebP file')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          expected = 'homepage-bilingual-final.webp?v=20260808-final-r1'
          replacement = 'homepage-bilingual-final.webp?v=20260808-reuploaded-r4'
          if expected not in text:
              raise SystemExit('README does not contain the expected hero reference')
          readme.write_text(text.replace(expected, replacement, 1), encoding='utf-8')
          PY

          rm -rf bootstrap
          rm -f .github/workflows/rerender-readme-hero.yml

      - name: Commit final clean state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: refresh re-uploaded README homepage hero'
          git push origin HEAD:main
