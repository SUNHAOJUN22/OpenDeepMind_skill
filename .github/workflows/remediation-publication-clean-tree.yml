name: One-shot OpenDeepMind clean-tree remediation

on:
  push:
    branches:
      - remediation/publication-evidence-clean-tree

permissions:
  contents: write

concurrency:
  group: opendeepmind-clean-tree-remediation
  cancel-in-progress: false

jobs:
  qualify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/publication-evidence-clean-tree
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
            requirements*.lock
            constraints*.txt

      - name: Install the repository validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          if [[ -f requirements-ci.lock ]]; then
            python -m pip install --disable-pip-version-check -r requirements-ci.lock
          elif [[ -f requirements-dev.txt ]]; then
            python -m pip install --disable-pip-version-check -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi
          if [[ -f pyproject.toml ]]; then
            python -m pip install --disable-pip-version-check -e . --no-deps
          fi
          python -m pip check

      - name: Remove non-authoritative workflow residue
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/exact-tree-export.yml
          rm -f .github/workflows/v19-skill-contract.yml
          rm .github/workflows/remediation-publication-clean-tree.yml

      - name: Execute repository-owned qualification surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          if [[ -d tests ]]; then
            python -m pytest -q
          fi
          for validator in \
            scripts/quality_gate.py \
            scripts/validate_repository.py \
            scripts/verify_repository.py \
            scripts/validate_skill.py \
            scripts/audit_repository.py; do
            if [[ -f "$validator" ]]; then
              python "$validator"
            fi
          done
          git diff --check

      - name: Verify bounded workflow-only diff and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          required = {
              '.github/workflows/exact-tree-export.yml',
              '.github/workflows/remediation-publication-clean-tree.yml',
          }
          allowed = required | {'.github/workflows/v19-skill-contract.yml'}
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          )
          missing = required - actual
          unexpected = actual - allowed
          if missing or unexpected:
              raise SystemExit(
                  f'unexpected workflow diff: missing={sorted(missing)!r} '
                  f'unexpected={sorted(unexpected)!r} actual={sorted(actual)!r}'
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): restore authoritative workflow inventory"
          git push origin HEAD:remediation/publication-evidence-clean-tree
