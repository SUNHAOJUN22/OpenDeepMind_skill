name: Public CPU refinement dependencies

on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-refinement-deps.yml]

permissions:
  contents: read

jobs:
  retrieve-public-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download public OpenMM wheel and pinned PDBFixer source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          out=pathlib.Path('public_dependencies'); out.mkdir()
          with urllib.request.urlopen('https://pypi.org/pypi/OpenMM/8.4.0/json',timeout=40) as r:
              metadata=json.load(r)
          choices=[x for x in metadata['urls'] if x['filename']=='openmm-8.4.0-cp313-cp313-manylinux_2_34_x86_64.whl']
          assert len(choices)==1
          item=choices[0]
          specs=[{'name':item['filename'],'url':item['url'],'expected_sha256':item['digests']['sha256']},
                 {'name':'pdbfixer_5e658a4fb8d2b90d65ca8408c845cbf104ce7099.zip',
                  'url':'https://codeload.github.com/openmm/pdbfixer/zip/5e658a4fb8d2b90d65ca8408c845cbf104ce7099'}]
          records=[]
          for spec in specs:
              req=urllib.request.Request(spec['url'],headers={'User-Agent':'public-research-asset-verification/1.0'})
              size=0; sha=hashlib.sha256()
              with urllib.request.urlopen(req,timeout=90) as response, (out/spec['name']).open('wb') as f:
                  if response.status!=200 or not response.url.startswith('https://'):raise RuntimeError('Unexpected transport response')
                  for block in iter(lambda:response.read(1024*1024),b''):
                      size+=len(block)
                      if size>50_000_000:raise RuntimeError('Asset exceeds bounded size')
                      f.write(block);sha.update(block)
              if spec.get('expected_sha256') and sha.hexdigest()!=spec['expected_sha256']:raise RuntimeError('Published checksum mismatch')
              records.append({'name':spec['name'],'source_url':spec['url'],'bytes':size,'sha256':sha.hexdigest(),'published_sha256_checked':bool(spec.get('expected_sha256'))})
          manifest={'private_candidate_data_uploaded':False,'new_structure_predictions':0,'files':records}
          (out/'PUBLIC_DEPENDENCIES_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Return public dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-openmm-pdbfixer-deps
          path: public_dependencies/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
