name: TNFA cloud capability check - public inputs only
on:
  push:
    branches: [tnfa-cloud-execution-20261108]
    paths: [.github/workflows/tnfa-cloud-capability-20261108.yml]
permissions:
  contents: read
concurrency:
  group: tnfa-cloud-capability-20261108
  cancel-in-progress: false
jobs:
  public-capability-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check runner and public network without disclosing candidates
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TNFA_PRIVATE_FASTA: ${{ secrets.TNFA_PRIVATE_FASTA }}
          TNFA_RESULT_PASSWORD: ${{ secrets.TNFA_RESULT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, platform, shutil, subprocess, sys, urllib.request, urllib.error
          out = pathlib.Path('public_capability_evidence')
          out.mkdir(exist_ok=False)
          # Never serialize credential values, candidate data, or environment contents.
          present = {k: bool(os.environ.get(k, '').strip()) for k in ('NVIDIA_API_KEY', 'NGC_API_KEY', 'HF_TOKEN', 'TNFA_PRIVATE_FASTA', 'TNFA_RESULT_PASSWORD')}
          gpu = None
          if shutil.which('nvidia-smi'):
              p = subprocess.run(['nvidia-smi','--query-gpu=name,memory.total','--format=csv,noheader'], capture_output=True, text=True, timeout=10)
              gpu = {'exit_code': p.returncode, 'summary': p.stdout.strip()[:500]}
          urls = [
              ('TNF_reference_1TNF', 'https://files.rcsb.org/download/1TNF.cif'),
              ('non_TNF_framework_7EOW', 'https://files.rcsb.org/download/7EOW.cif'),
              ('RFD4_VHH_documentation', 'https://rfd4-proteina.org/latest/examples/antibody_design_tutorial.html'),
              ('RFD4_NIM_documentation', 'https://docs.nvidia.com/nim/bionemo/rfd4-proteina/api-reference/generate-rfd-4-proteina-designs'),
              ('competition_rules', 'https://aiprotein.sjtu.edu.cn/rules'),
          ]
          def get(item):
              name, url = item
              record = {'name':name,'url':url,'method':'GET','authenticated':False}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'TNFA-public-capability-check/1.0'})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      data = r.read(8000001)
                      record.update(http_status=r.status, final_url=r.geturl(), content_type=r.headers.get('Content-Type',''))
                  if len(data)>8000000:
                      raise ValueError('public response exceeds bounded size')
                  record.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  (out/(name+'.source')).write_bytes(data)
              except Exception as exc:
                  record.update(error_type=type(exc).__name__, error=str(exc)[:300])
              return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              network=list(pool.map(get,urls))
          report={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'python':sys.version, 'platform':platform.platform(), 'cpu_count':os.cpu_count(), 'disk_free_bytes':shutil.disk_usage('.').free, 'gpu':gpu, 'credential_or_private_input_configured':present, 'public_GET_checks':network, 'candidate_sequences_read':0, 'candidate_sequences_published':0, 'model_POST_requests':0, 'model_inference_runs':0, 'competition_submission_attempts':0, 'main_branch_modified':False, 'note':'Availability checks are not model inference or validation. Presence of a key is not proof it is valid or has quota. Only booleans are recorded.'}
          (out/'CAPABILITY_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          manifest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          (out/'SHA256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Return public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tnfa-cloud-capability-public-only-20261108
          path: public_capability_evidence/
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
