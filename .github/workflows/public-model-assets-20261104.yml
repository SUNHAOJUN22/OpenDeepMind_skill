name: Public model assets 20261104

on:
  push:
    branches: [agent/public-model-assets-20261104]
    paths: [.github/workflows/public-model-assets-20261104.yml]

permissions:
  contents: read

concurrency:
  group: public-model-assets-20261104
  cancel-in-progress: false

jobs:
  fetch-public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch and verify author-published model assets only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          root = pathlib.Path('public-assets')
          root.mkdir()
          records = []
          def get(url, path, algorithm=None, expected=None):
              out = root / path
              out.parent.mkdir(parents=True, exist_ok=True)
              last = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'public-research-model-verification/1.0'})
                      with urllib.request.urlopen(request, timeout=100) as response, out.open('wb') as handle:
                          count = 0
                          while True:
                              data = response.read(1048576)
                              if not data:
                                  break
                              count += len(data)
                              if count > 70000000:
                                  raise RuntimeError('Asset exceeds explicit 70 MB per-file cap')
                              handle.write(data)
                      data = out.read_bytes()
                      if not data:
                          raise RuntimeError('Empty asset')
                      if algorithm and hashlib.new(algorithm, data).hexdigest() != expected:
                          raise RuntimeError('Author checksum mismatch: ' + path)
                      record = {'path': path, 'url': url, 'size_bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'author_checksum_algorithm': algorithm, 'author_checksum': expected}
                      records.append(record)
                      print(json.dumps(record), flush=True)
                      return data
                  except Exception as error:
                      last = error
                      if out.exists():
                          out.unlink()
                      if attempt < 2:
                          time.sleep(3)
              raise RuntimeError('Download failed: ' + url) from last
          get('https://zenodo.org/records/7258553/files/nanobody_model_1?download=1', 'weights/nanobody_model_1', 'md5', '4591075f467ca9f76a37a5d1d3cfe591')
          get('https://raw.githubusercontent.com/dauparas/ProteinMPNN/8907e6671bfbfc92303b5f79c4b5e6ce47cdef57/vanilla_model_weights/v_48_020.pt', 'weights/v_48_020.pt', 'sha256', 'c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd')
          commit = '0df4e2ad82a1aa60f37ea9dae335d1198159ef78'
          tree_url = 'https://api.github.com/repos/oxpig/ImmuneBuilder/git/trees/' + commit + '?recursive=1'
          tree = json.loads(get(tree_url, 'provenance/ImmuneBuilder_tree.json'))
          for item in tree['tree']:
              path = item['path']
              if item['type'] == 'blob' and ((path.startswith('ImmuneBuilder/') and path.endswith('.py')) or path in ('LICENSE', 'README.md', 'setup.py')):
                  get('https://raw.githubusercontent.com/oxpig/ImmuneBuilder/' + commit + '/' + path, 'source/ImmuneBuilder/' + path)
          pcommit = '8907e6671bfbfc92303b5f79c4b5e6ce47cdef57'
          for path in ('protein_mpnn_utils.py', 'protein_mpnn_run.py', 'LICENSE', 'README.md', 'helper_scripts/parse_multiple_chains.py', 'helper_scripts/make_fixed_positions_dict.py', 'helper_scripts/assign_fixed_chains.py'):
              get('https://raw.githubusercontent.com/dauparas/ProteinMPNN/' + pcommit + '/' + path, 'source/ProteinMPNN/' + path)
          (root / 'manifest.json').write_text(json.dumps({'purpose': 'Author-published public assets only. No private research sequence or target is included.', 'records': records}, indent=2))
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          if total > 80000000:
              raise RuntimeError('Bundle exceeds explicit 80 MB cap')
          print('PUBLIC_ASSET_BYTES', total)
          PY
      - name: Preserve verified public assets for immediate retrieval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-protein-model-assets-20261104
          path: public-assets/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
