name: Public NanoBodyBuilder2 ensemble assets

on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-nanobody-ensemble-assets.yml]

permissions:
  contents: read

concurrency:
  group: cj26-public-nanobody-ensemble-assets-20261104
  cancel-in-progress: false

jobs:
  retrieve-public-checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Download three author-published weights and verify published checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          out = pathlib.Path('public_ensemble_assets')
          out.mkdir()
          checks = {2: '620fc916720bc7068cd18c7afa1aea8d',
                    3: 'f1ef0a66a54efb9d14ddbb97fdc30785',
                    4: 'a7e14a33f4c00e96df896120e9cf8522'}
          def download(item):
              number, expected = item
              name = 'nanobody_model_' + str(number)
              url = 'https://zenodo.org/records/7258553/files/' + name + '?download=1'
              request = urllib.request.Request(url, headers={'User-Agent': 'public-research-asset-verification/1.0'})
              digest, md5, size = hashlib.sha256(), hashlib.md5(), 0
              started = time.monotonic()
              with urllib.request.urlopen(request, timeout=180) as response, (out/name).open('wb') as f:
                  if response.status != 200 or not response.url.startswith('https://'):
                      raise RuntimeError('Invalid HTTPS response')
                  for chunk in iter(lambda: response.read(1024*1024), b''):
                      size += len(chunk)
                      if size > 230_000_000 or time.monotonic()-started > 520:
                          raise RuntimeError('Bounded download exceeded')
                      f.write(chunk); digest.update(chunk); md5.update(chunk)
              if md5.hexdigest() != expected:
                  raise RuntimeError('Published MD5 mismatch for '+name)
              return {'name': name, 'source_url': url, 'bytes': size,
                      'md5': md5.hexdigest(), 'published_md5': expected,
                      'sha256': digest.hexdigest(), 'published_checksum_verified': True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              files = list(pool.map(download, checks.items()))
          manifest = {'purpose': 'Public weights for local CPU four-checkpoint VHH monomer ensemble',
                      'private_sequences_uploaded': False, 'protein_predictions_in_cloud': 0,
                      'source_doi': '10.5281/zenodo.7258553', 'files': files}
          (out/'PUBLIC_ENSEMBLE_ASSETS.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Return public model assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-nanobody-models234-assets
          path: public_ensemble_assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
