name: One-time ledger special-file hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-ledger-special-files-once.yml

permissions:
  contents: write

concurrency:
  group: one-time-ledger-special-file-hardening
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'SUNHAOJUN22'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify immutable repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6f77eecf43aa6c7055b685f336b58afb3bdcf745"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Apply bounded regular-file reader and negative tests
        shell: python
        run: |
          from pathlib import Path

          script_path = Path("open-deep-mind/scripts/validate_ledger.py")
          source = script_path.read_text(encoding="utf-8")

          import_anchor = "import math\nimport re\nimport sys\n"
          import_replacement = "import math\nimport os\nimport re\nimport stat\nimport sys\n"
          if source.count(import_anchor) != 1:
              raise SystemExit(f"unexpected import anchor count: {source.count(import_anchor)}")
          source = source.replace(import_anchor, import_replacement)

          helper_anchor = '''def load_ledger(path: Path) -> Any:
              """Read bounded, unambiguous UTF-8 JSON without nonfinite values."""
              with path.open("rb") as stream:
                  raw = stream.read(MAX_LEDGER_BYTES + 1)
          '''
          helper_replacement = '''def read_bounded_regular_file(path: Path, limit: int) -> bytes:
              """Read one stable regular file without following links or blocking on FIFOs."""
              observed = path.lstat()
              if stat.S_ISLNK(observed.st_mode) or not stat.S_ISREG(observed.st_mode):
                  raise ValueError("ledger input must be a regular file")
              flags = os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0) | getattr(os, "O_NONBLOCK", 0)
              fd = os.open(path, flags)
              try:
                  opened = os.fstat(fd)
                  if not stat.S_ISREG(opened.st_mode):
                      raise ValueError("ledger input must be a regular file")
                  if (opened.st_dev, opened.st_ino) != (observed.st_dev, observed.st_ino):
                      raise ValueError("ledger input changed while it was opened")
                  chunks: list[bytes] = []
                  remaining = limit + 1
                  while remaining:
                      chunk = os.read(fd, min(1024 * 1024, remaining))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  return b"".join(chunks)
              finally:
                  os.close(fd)


          def load_ledger(path: Path) -> Any:
              """Read bounded, unambiguous UTF-8 JSON without nonfinite values."""
              raw = read_bounded_regular_file(path, MAX_LEDGER_BYTES)
          '''
          if source.count(helper_anchor) != 1:
              raise SystemExit(f"unexpected loader anchor count: {source.count(helper_anchor)}")
          script_path.write_text(source.replace(helper_anchor, helper_replacement), encoding="utf-8", newline="\n")

          test_path = Path("open-deep-mind/tests/test_ledger_json_boundary.py")
          tests = test_path.read_text(encoding="utf-8")
          test_import_anchor = "import json\nimport subprocess\n"
          test_import_replacement = "import json\nimport os\nimport subprocess\n"
          if tests.count(test_import_anchor) != 1:
              raise SystemExit(f"unexpected test import anchor count: {tests.count(test_import_anchor)}")
          tests = tests.replace(test_import_anchor, test_import_replacement)

          helper_test_anchor = '''        self.assertRegex(payload.get("error", ""), expected)
                  self.assertNotIn("Traceback", result.stderr)
          '''
          helper_test_replacement = '''        self.assertRegex(payload.get("error", ""), expected)
                  self.assertNotIn("Traceback", result.stderr)

              def check_path_rejected(self, path: Path, expected: str) -> None:
                  result = subprocess.run(
                      [sys.executable, str(SCRIPT), str(path)],
                      text=True, capture_output=True, check=False, timeout=3,
                  )
                  self.assertEqual(result.returncode, 1, result.stdout)
                  payload = json.loads(result.stdout)
                  self.assertFalse(payload["ok"])
                  self.assertRegex(payload.get("error", ""), expected)
                  self.assertNotIn("Traceback", result.stderr)
          '''
          if tests.count(helper_test_anchor) != 1:
              raise SystemExit(f"unexpected helper test anchor count: {tests.count(helper_test_anchor)}")
          tests = tests.replace(helper_test_anchor, helper_test_replacement)

          insertion_anchor = '''    def test_input_budget_is_enforced(self) -> None:
                  self.check_rejected(b' ' * (8 * 1024 * 1024 + 1), 'input budget')
          '''
          new_tests = '''    def test_directory_input_is_rejected(self) -> None:
                  with tempfile.TemporaryDirectory() as folder:
                      self.check_path_rejected(Path(folder), "regular file")

              def test_symbolic_link_input_is_rejected(self) -> None:
                  with tempfile.TemporaryDirectory() as folder:
                      root = Path(folder)
                      target = root / "target.json"
                      target.write_text("{}", encoding="utf-8")
                      link = root / "ledger.json"
                      try:
                          link.symlink_to(target)
                      except (OSError, NotImplementedError) as exc:
                          self.skipTest(f"symbolic links unavailable: {exc}")
                      self.check_path_rejected(link, "regular file|symbolic link|too many levels")

              @unittest.skipUnless(hasattr(os, "mkfifo"), "FIFO support is unavailable")
              def test_fifo_input_is_rejected_without_blocking(self) -> None:
                  with tempfile.TemporaryDirectory() as folder:
                      fifo = Path(folder) / "ledger.fifo"
                      os.mkfifo(fifo)
                      self.check_path_rejected(fifo, "regular file")

              def test_input_budget_is_enforced(self) -> None:
                  self.check_rejected(b' ' * (8 * 1024 * 1024 + 1), 'input budget')
          '''
          if tests.count(insertion_anchor) != 1:
              raise SystemExit(f"unexpected insertion anchor count: {tests.count(insertion_anchor)}")
          test_path.write_text(tests.replace(insertion_anchor, new_tests), encoding="utf-8", newline="\n")
      - name: Remove staging workflow and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-ledger-special-files-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-deep-mind/scripts/validate_ledger.py open-deep-mind/tests/test_ledger_json_boundary.py
          git commit -m "fix(ledger): reject links and special-file inputs"
      - name: Run focused and full repository validation
        shell: bash
        run: |
          set -euo pipefail
          python open-deep-mind/scripts/validate_ledger.py open-deep-mind/assets/example-ledger.json
          python -m unittest open-deep-mind/tests/test_ledger_json_boundary.py -v
          python open-deep-mind/first-philosophy/scripts/validate_module.py
          python open-deep-mind/first-principles/scripts/validate_module.py
          python open-deep-mind/triz/scripts/validate_triz_module.py
          python open-deep-mind/evals/scripts/validate_evals.py
          python open-deep-mind/scripts/validate_repository.py .
          python -m unittest discover -s open-deep-mind/tests -p "test_*.py" -v
          python -m compileall -q open-deep-mind
          git diff --exit-code
      - name: Publish one atomic repair commit
        shell: bash
        run: git push origin HEAD:main
