name: Delete obsolete test branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-test-branch.yml

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete agent/test-image-symlink
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/agent/test-image-symlink"
