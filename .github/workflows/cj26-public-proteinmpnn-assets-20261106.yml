name: CJ26 public ProteinMPNN assets
on:
  push:
    branches: [cj26-public-model-assets-20261104]
    paths: [.github/workflows/cj26-public-proteinmpnn-assets-20261106.yml]
permissions:
  contents: read
jobs:
  public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch fixed-version author assets only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path('public_assets');root.mkdir()
          commit='8907e6671bfbfc92303b5f79c4b5e6ce47cdef57'
          specs=[('vanilla_model_weights/v_48_020.pt',8000000,'66f81553eea491dfc1307582c679ef029511937b'),('protein_mpnn_utils.py',400000,None),('protein_mpnn_run.py',400000,None),('LICENSE',20000,None),('README.md',200000,None)]
          rows=[]
          for path,limit,expected in specs:
              url='https://raw.githubusercontent.com/dauparas/ProteinMPNN/'+commit+'/'+path
              with urllib.request.urlopen(url,timeout=60) as response:
                  if response.status!=200:raise RuntimeError('Public download failed')
                  data=response.read(limit+1)
              if not data or len(data)>limit:raise RuntimeError('Download size outside bound')
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if expected and blob!=expected:raise RuntimeError('Pinned Git blob identity mismatch')
              dest=root/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              rows.append({'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob_sha':blob,'pinned_blob_verified':bool(expected),'source_url':url})
          (root/'MANIFEST.json').write_text(json.dumps({'commit':commit,'existing_private_candidates_uploaded':False,'protein_predictions_executed':0,'files':rows},indent=2)+'\n')
          PY
      - name: Return public source and checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cj26-public-proteinmpnn-verified-20261106
          path: public_assets/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
